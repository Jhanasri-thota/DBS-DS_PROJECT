spring.application.name=VotingHub
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/votehub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.time-zone=Asia/Kolkata

votehub.otp.expiry-minutes=5
votehub.otp.max-attempts=3
votehub.demo-otp-visible=true